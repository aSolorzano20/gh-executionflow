name: Matrix Demo
on: push
jobs:
  build:
    strategy:
      matrix:
        node-version: [22, 23, 24]
        operating-system: [ubuntu-latest, windows-latest]
    runs-on: ${{ matric.operating-system }}
    steps:
      - name: Get code
        uses: actions/checkout@v7
      - name: Install NodeJS
        uses: actions/cache@v6
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: npm ci
      - name: Build project
        run: npm run build